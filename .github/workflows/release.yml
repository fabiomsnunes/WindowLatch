name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Built ad-hoc, then re-signed with the release certificate by scripts/sign-app.sh.
      - name: Build archive
        run: |
          xcodebuild -scheme WindowLatch \
            -configuration Release \
            -archivePath build/WindowLatch.xcarchive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            archive

      - name: Export .app
        run: |
          xcodebuild -exportArchive \
            -archivePath build/WindowLatch.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist scripts/exportOptions.plist

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign .app with the release certificate
        run: scripts/sign-app.sh build/export/WindowLatch.app

      - name: Create .dmg
        run: |
          brew install create-dmg
          create-dmg \
            --window-size 500 350 \
            --icon-size 96 \
            --app-drop-link 350 175 \
            --icon "WindowLatch.app" 150 175 \
            "build/WindowLatch-${GITHUB_REF_NAME}.dmg" \
            build/export/WindowLatch.app

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/WindowLatch-*.dmg
          draft: false
          generate_release_notes: true
