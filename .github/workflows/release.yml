name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Built ad-hoc, then re-signed with the release certificate by scripts/sign-app.sh.
      - name: Build archive
        run: |
          xcodebuild -scheme WindowLatch \
            -configuration Release \
            -archivePath build/WindowLatch.xcarchive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            archive

      - name: Export .app
        run: |
          xcodebuild -exportArchive \
            -archivePath build/WindowLatch.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist scripts/exportOptions.plist

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          # codesign only finds identities in keychains on the search list, and the
          # runner's macOS skips an untrusted self-signed one ("no identity found").
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "WindowLatch Release" -p "$keychain" > "$RUNNER_TEMP/signing-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing-cert.pem"
          security find-identity -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Sign .app with the release certificate
        run: scripts/sign-app.sh build/export/WindowLatch.app

      - name: Create .dmg
        run: |
          brew install create-dmg
          create-dmg \
            --window-size 500 350 \
            --icon-size 96 \
            --app-drop-link 350 175 \
            --icon "WindowLatch.app" 150 175 \
            "build/WindowLatch-${GITHUB_REF_NAME}.dmg" \
            build/export/WindowLatch.app

      - name: Create Sparkle appcast
        env:
          SPARKLE_VERSION: 2.10.1
          SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          sparkle="$RUNNER_TEMP/sparkle"
          mkdir -p "$sparkle"
          curl -fsSL -o "$sparkle/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $sparkle/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf "$sparkle/sparkle.tar.xz" -C "$sparkle"
          key_file="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key_file"
          SPARKLE_BIN="$sparkle/bin" SPARKLE_ED_KEY_FILE="$key_file" scripts/make-appcast.sh \
            "$GITHUB_REF_NAME" build/export/WindowLatch.app \
            "build/WindowLatch-${GITHUB_REF_NAME}.dmg" build/appcast.xml
          rm "$key_file"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/WindowLatch-*.dmg
            build/appcast.xml
          draft: false
          generate_release_notes: true
